name: Publish package to GitHub Packages

# DanbiEduCorp fork: publishes @DanbiEduCorp/axios to GitHub Packages instead of npmjs.
# Manual trigger only: upstream `v1.*.*` tags share names with ours and would run upstream's npmjs workflow.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          registry-url: 'https://npm.pkg.github.com/'
          scope: '@DanbiEduCorp'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # dist/ is not committed since 1.x upstream moved it to .gitignore, so it must be built here.
      - name: Build project
        run: npm run build

      # npm provenance and `npm stage publish` are npmjs-only features and are not supported by GitHub Packages.
      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
